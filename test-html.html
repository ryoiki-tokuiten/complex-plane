<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: white; }
  #canvases_section {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: auto;
    width: 800px;
    height: 600px;
    border: 2px solid #333;
    padding: 16px;
  }
  .canvas-row {
    display: flex;
    flex-direction: row;
    gap: 16px;
    flex-wrap: nowrap;
    min-width: min-content; /* Ensure row grows with content */
    min-height: 200px; /* Empty rows have height */
    background: #222;
    padding: 8px;
    border-radius: 8px;
  }
  .plane-column {
    flex: 0 0 auto;
    height: 200px;
    background: #444;
    border: 1px solid #666;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Drop indicators */
  .drop-indicator-row {
      height: 8px;
      background: #a78bfa;
      border-radius: 4px;
      margin: 4px 0;
  }
  .drop-indicator-col {
      width: 8px;
      background: #a78bfa;
      border-radius: 4px;
      margin: 0 4px;
  }
</style>
</head>
<body>
<div id="canvases_section">
  <div class="canvas-row">
    <div class="plane-column" style="width: 300px;">A</div>
    <div class="plane-column" style="width: 600px;">B</div>
  </div>
  <div class="canvas-row">
    <div class="plane-column" style="width: 400px;">C</div>
  </div>
</div>
</body>
</html>
