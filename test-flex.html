<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    display: flex;
    flex-wrap: wrap;
    width: max-content;
    min-width: 100%;
    border: 2px solid red;
    overflow: auto;
  }
  .item {
    flex: 0 0 auto;
    width: 300px;
    height: 100px;
    border: 1px solid blue;
    background: #eef;
  }
  .break {
    flex-basis: 100%;
    height: 0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="item" style="width: 500px;">A</div>
    <div class="item" style="width: 400px;">B</div>
    <div class="break"></div>
    <div class="item" style="width: 600px;">C</div>
  </div>
</body>
</html>
